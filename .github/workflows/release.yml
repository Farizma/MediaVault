# Builds MediaVault_v<version>_setup.exe on Windows and publishes it as a GitHub release.
# Runs when main gets a version.py whose release does not exist yet (it creates the tag v<version> itself),
# when a tag v<version> is pushed (it must match version.py), or by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-setup:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Is there a release to make?
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path version.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          $published = gh release view "v$v" --repo $env:GITHUB_REPOSITORY --json publishedAt --jq .publishedAt 2>$null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          # A push to main builds when this version has no release yet. A release of the same version published less
          # than a day ago is rebuilt and replaced (a fix landed right after it); an older one is left alone, so
          # people who installed it are never handed different files under the same version number.
          $fresh = $exists -and ((Get-Date).ToUniversalTime() - [datetime]::Parse($published).ToUniversalTime()).TotalHours -lt 24
          $replace = $fresh -and ($env:GITHUB_REF_TYPE -ne "tag")
          $go = ($env:GITHUB_REF_TYPE -eq "tag") -or ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") -or (-not $exists) -or $replace
          "build=$($go.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "replace=$($replace.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "version $v, release exists: $exists (published $published), replace: $replace, build: $go"

      - uses: actions/setup-python@v6
        if: steps.plan.outputs.build == 'true'
        with:
          python-version: "3.13"

      - name: Install build tools
        if: steps.plan.outputs.build == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pychromecast pyatv pyinstaller

      - name: Check the tag matches version.py
        if: steps.plan.outputs.build == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from version import VERSION
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != VERSION:
              sys.exit(f"tag v{tag} does not match version.py ({VERSION})")

      - name: Tests
        if: steps.plan.outputs.build == 'true'
        run: python -m unittest tests.test_core tests.test_qml_static tests.test_round8 tests.test_round9 tests.test_round10 tests.test_round11 tests.test_release tests.test_detail tests.test_v102 tests.test_v103 tests.test_v105 tests.test_v106 tests.test_v107 tests.test_v109 tests.test_v111 tests.test_v120 tests.test_v121 tests.test_v122 tests.test_v130 tests.test_qt tests.test_security -v

      - name: Install Inno Setup
        if: steps.plan.outputs.build == 'true'
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build EXE and setup
        if: steps.plan.outputs.build == 'true'
        run: python build_installer.py

      - name: Smoke test the build
        if: steps.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          $v = python -c "from version import VERSION; print(VERSION)"
          $setup = "dist\MediaVault_v${v}_setup.exe"
          if (-not (Test-Path $setup)) { throw "setup not built: $setup" }
          if (-not (Test-Path "dist\MediaVault\MediaVault.exe")) { throw "MediaVault.exe not built" }
          # silent per-user install into a temp folder, then check the files landed, then uninstall
          $dir = "$env:RUNNER_TEMP\mv-install"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=`"$dir`"", "/NORESTART" -Wait
          if (-not (Test-Path "$dir\MediaVault.exe")) { throw "silent install did not put MediaVault.exe in $dir" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          Get-FileHash $setup -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v6
        if: steps.plan.outputs.build == 'true'
        with:
          name: MediaVault-setup
          path: dist/MediaVault_v*_setup.exe

      - name: Publish release
        if: steps.plan.outputs.build == 'true' && (startsWith(github.ref, 'refs/tags/') || steps.plan.outputs.exists == 'false' || steps.plan.outputs.replace == 'true')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "from version import VERSION; print(VERSION)"
          $setup = "dist\MediaVault_v${v}_setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $notes = (Get-Content RELEASE_NOTES.md -Raw) + "`n`nSHA-256 of MediaVault_v${v}_setup.exe: ``$hash``"
          Set-Content release-notes.txt $notes
          $tag = "v$v"
          if ("${{ steps.plan.outputs.replace }}" -eq "true") {
            # same version, rebuilt from this commit: the tag moves here and the release is made again
            gh release delete $tag --cleanup-tag --yes
            $global:LASTEXITCODE = 0
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber
          } else {
            # creates the tag v<version> on this commit too
            gh release create $tag $setup --target $env:GITHUB_SHA --title "Media Vault $v" --notes-file release-notes.txt --latest
          }
